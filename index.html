<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doc ID Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#F7F8FA; --ink:#15223A; --muted:#5A6578; --line:#D8DDE6;
  --accent:#22508F; --accent-hover:#1B4178; --accent-ink:#FFFFFF; --accent-soft:#E6EEF8;
  --ok:#1D7552; --ok-bg:#E4F3EC; --warn:#935A08; --warn-bg:#FFF3DC; --bad:#AD2A20; --bad-bg:#FCEAE8;
  --chip:#E9EDF3; --shadow:0 12px 40px rgba(18,31,56,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F141D; --surface:#171F2D; --sunk:#131A26; --ink:#E6EBF3; --muted:#9BA6B7; --line:#2A3547;
  --accent:#86ABE6; --accent-hover:#A3C0EE; --accent-ink:#0E1522; --accent-soft:#1E2B42;
  --ok:#62C99D; --ok-bg:#15302A; --warn:#F0B75C; --warn-bg:#33270F; --bad:#F2928A; --bad-bg:#3A1E1C;
  --chip:#222D40; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#171F2D; --sunk:#131A26; --ink:#E6EBF3; --muted:#9BA6B7; --line:#2A3547;
  --accent:#86ABE6; --accent-hover:#A3C0EE; --accent-ink:#0E1522; --accent-soft:#1E2B42;
  --ok:#62C99D; --ok-bg:#15302A; --warn:#F0B75C; --warn-bg:#33270F; --bad:#F2928A; --bad-bg:#3A1E1C;
  --chip:#222D40; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{background:var(--chip);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who img{width:26px;height:26px;border-radius:50%}
.role{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.015em}
h2{font-size:17px;margin:0 0 12px;font-weight:650}
h3{font-size:15px;margin:0 0 8px;font-weight:650}
.lede{color:var(--muted);margin:0 0 20px;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Banners */
.banners{max-width:1180px;margin:0 auto;padding:12px 20px 0;display:grid;gap:8px}
.banners:empty{display:none}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:11px 14px;border:1px solid transparent}
.banner.low{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.empty,.banner.err{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner p{margin:0;color:var(--ink)}
.banner strong{color:inherit}
.banner .ico{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:currentColor}
.banner .ico i{color:var(--surface);font-style:normal}

/* Cards and forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:grid;gap:18px}
.req-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;align-items:start}
@media (max-width:880px){.req-grid{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:6px}
.field>label,.legend{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled,select:disabled{opacity:.6}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--sunk);flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:7px 14px;border-radius:7px;font-weight:500;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.seg input:disabled+span{opacity:.45;cursor:not-allowed}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 96px 40px;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.icon{padding:0;width:40px}
.btn.big{min-height:48px;font-size:16px;padding:10px 20px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.err-text{color:var(--bad);font-size:14px;margin:0}

/* Category panel */
.pool-name{font-weight:650;font-size:16px}
.pool-count{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
.pool-count small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.gauge{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;display:flex}
.gauge i{display:block;height:100%}
.gauge .used{background:var(--muted);opacity:.55}
.gauge .left{background:var(--ok)}
.gauge.low .left{background:var(--warn)}
.gauge.empty .left{background:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.notes{margin:0;padding-left:18px;font-size:14px}

/* Chips */
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--chip);white-space:nowrap}
.chip.Assigned{background:var(--ok-bg);color:var(--ok)}
.chip.Reserved{background:var(--warn-bg);color:var(--warn)}
.chip.Cancelled{background:var(--bad-bg);color:var(--bad)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.low{background:var(--warn-bg);color:var(--warn)}
.chip.empty{background:var(--bad-bg);color:var(--bad)}

/* Tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--sunk);white-space:nowrap;font-size:13px}
tr:last-child td{border-bottom:0}
td.id{font-weight:600;white-space:nowrap}
td .sub{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--sunk)}
tr.detail td{background:var(--sunk)}
.filters{display:grid;grid-template-columns:minmax(200px,2fr) repeat(3,minmax(140px,1fr));gap:10px}
.filters2{display:grid;grid-template-columns:repeat(2,minmax(140px,190px)) 1fr;gap:10px;align-items:end}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}.filters2{grid-template-columns:1fr 1fr}}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px}
.hist li{display:grid;grid-template-columns:170px 1fr;gap:10px}
@media (max-width:600px){.hist li{grid-template-columns:1fr}}

/* Admin */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:0}
.subtab{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.cat-list{display:grid;gap:12px}
.cat{display:grid;gap:12px}
.cat-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;background:var(--sunk);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:6px 0 0}
.idlist{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:260px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-size:13.5px}
.empty-state{text-align:center;padding:36px 20px;color:var(--muted)}
.empty-state h2{color:var(--ink)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:50;display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dialog{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:580px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dialog header{padding:20px 22px 12px}
.dialog header h2{font-size:19px;margin:0 0 4px;line-height:1.3}
.dialog .body{padding:4px 22px 16px;overflow:auto;display:grid;gap:10px}
.dialog footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;background:var(--sunk)}
.ticket{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ticket .stub{padding:10px 12px;background:var(--sunk);border-right:2px dashed var(--line);display:grid;align-content:center;font-size:12.5px;color:var(--muted);width:124px}
.ticket .stub b{color:var(--ink);font-size:13px;font-weight:600}
.ticket .val{padding:10px 14px;display:grid;align-content:center;min-width:0}
.ticket .id{font-size:clamp(24px,6vw,32px);font-weight:700;letter-spacing:.015em;line-height:1.15;user-select:all;overflow-wrap:anywhere}
.ticket .id.meps-raw{font-family:"MEPS Bookman Universal",serif;font-weight:400}
.ticket .fmt{font-size:12px;color:var(--muted)}
.ticket .act{display:grid;align-content:center;padding:10px 12px 10px 0}
.copied{background:var(--ok-bg)!important;color:var(--ok)!important;border-color:transparent!important}
@media (max-width:480px){.ticket{grid-template-columns:minmax(0,1fr) auto}.ticket .stub{grid-column:1/-1;border-right:0;border-bottom:2px dashed var(--line);width:auto;display:flex;gap:8px}}
@keyframes stamp{from{transform:scale(1.06);opacity:0}to{transform:none;opacity:1}}
.ticket{animation:stamp .22s ease-out both}
@media (prefers-reduced-motion:reduce){.ticket{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast:empty{display:none}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.signin{max-width:440px;margin:40px auto}
.signin details summary{cursor:pointer;color:var(--accent);font-weight:600}
.signin details[open] summary{margin-bottom:12px}
.signin .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.signin .or::before,.signin .or::after{content:"";flex:1;height:1px;background:var(--line)}
.google{width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>Doc ID Desk</b><span>Document ID allocation</span></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="who" id="who"></div>
</div></header>
<div class="banners" id="banners"></div>
<main id="main"></main>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- Constants ---------- */
const POOL_CHUNK = 500;          // Doc IDs per pool document
const REC_CHUNK = 100;           // assignment records per ledger document
const LOCK_TTL = 15000;          // category lock lease (ms)
const MAX_PER_REQUEST = 100;
const MAX_RANGE = 10000;        // Doc IDs per range
const DEFAULT_TYPES = ['Script','Hosting Document','Lead Sheet'];
const STATUSES = ['Reserved','Assigned','Cancelled'];
const STATUS_HELP = {Reserved:'Waiting for Done', Assigned:'Used', Cancelled:'Cancelled — never reused'};
const TAB_ID = Math.random().toString(36).slice(2,10);

/* ---------- MEPS character handling ----------
   In the source spreadsheets the MEPS column is text in the "MEPS Bookman Universal"
   font, stored as private-use characters: 1-9 = U+F734..U+F73C, 0 = U+F73D.
   We always store and copy the original characters; decoding is only for display/search. */
const MEPS_MAP = {'\uF73D':'0'};
for (let d=1; d<=9; d++) MEPS_MAP[String.fromCharCode(0xF733+d)] = String(d);
function mepsDigits(s){ let o=''; for (const ch of String(s||'')) o += MEPS_MAP[ch] ?? (/[\uE000-\uF8FF]/.test(ch) ? '?' : ch); return o; }
function toMeps(digits){ let o=''; for (const ch of String(digits)) o += ch==='0' ? '\uF73D' : (ch>='1'&&ch<='9' ? String.fromCharCode(0xF733+Number(ch)) : ch); return o; }
const MEPS_FONT = (()=>{ try{ const c=document.createElement('canvas').getContext('2d'); const t='\uF734\uF735\uF736\uF737\uF73D\uF73C';
  c.font='40px monospace'; const a=c.measureText(t).width; c.font='40px "MEPS Bookman Universal", monospace'; return Math.abs(c.measureText(t).width-a)>0.5; }catch(e){ return false; } })();

/* ---------- Small helpers ---------- */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const rid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowIso = () => new Date().toISOString();
const slug = s => (String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'category');
const plural = (n, one, many) => `${n.toLocaleString()} ${n===1?one:(many||one+'s')}`;
const fmtDate = iso => iso ? new Date(iso).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}) : '';
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
class AppError extends Error { constructor(msg, extra){ super(msg); Object.assign(this, extra||{}); } }
function el(tag, attrs, ...kids){
  const n = document.createElement(tag); let val;
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==='class') n.className=v;
    else if (k==='text') n.textContent=v;
    else if (k==='value') val=v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k==='checked'||k==='disabled'||k==='selected'||k==='multiple') n[k]=!!v;
    else n.setAttribute(k, v===true?'':v);
  }
  for (const k of kids.flat(Infinity)){ if (k==null||k===false) continue; n.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  if (val!==undefined) n.value=val;
  return n;
}
function opt(value, label, selected, disabled){ return el('option',{value, selected, disabled}, label); }
let toastT=0;
function toast(msg, ms=3200){ const t=document.getElementById('toast'); t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.textContent='', ms); }

/* ---------- State ---------- */
const S = {
  db:null, auth:null, downloads:true, uid:null, me:{email:'',name:''}, isAdmin:false, canWrite:true, fatal:null, ready:false,
  phase:'loading', authErr:'', authMsg:'', si:{user:'', pw:'', link:''}, people:{name:'', username:'', userEdited:false, role:'secretary', method:'password', email:'', pw:'', busy:false, msg:'', err:''}, members:{}, unsubs:[],
  cats:{}, pools:{}, alloc:{}, rec:{}, config:{},
  loaded:{cats:false,pools:false,alloc:false,rec:false,config:false},
  view:'request', adminTab:'categories',
  form:{catId:'', format:'regular', mnemonic:'', lines:[{type:'', qty:1}]},
  formErr:'', busy:false, busyMsg:'',
  filters:{q:'', catId:'', docType:'', status:'', from:'', to:''}, showLimit:200, expanded:new Set(),
  imports:[], range:{target:'new', name:'', first:'', last:'', exclude:'', skipTop:false, notes:'', meps:true, msg:'', busy:false, done:''}, openCats:new Set(), showAllIds:new Set(),
  d:null,
};
const docTypes = (all=false) => {
  const t = Array.isArray(S.config.app?.docTypes) ? S.config.app.docTypes : DEFAULT_TYPES.map(n=>({name:n, active:true}));
  return all ? t : t.filter(x=>x.active!==false);
};

/* ---------- Derived data ---------- */
function derive(){
  if (S.d) return S.d;
  const pools={}, stats={}, records=[], names={};
  if (S.me.email) names[S.me.email]=S.me.name||S.me.email;
  for (const [cid,c] of Object.entries(S.cats)){
    const arr=[]; let complete=true;
    for (const ch of c.chunks||[]){ const p=S.pools[ch.id]; if (!p){ complete=false; break; } for (const e of poolArr(p)) arr.push(e); }
    pools[cid]={arr, complete};
  }
  for (const r of Object.values(S.rec)) for (const e of Object.values(r.entries||{})){
    records.push(e);
    if (e.reservedBy && e.reservedByName) names[e.reservedBy]=e.reservedByName;
    if (e.confirmedBy && e.confirmedByName) names[e.confirmedBy]=e.confirmedByName;
    for (const h of e.history||[]) if (h.by && h.byName && !names[h.by]) names[h.by]=h.byName;
  }
  records.sort((a,b)=> String(b.reservedAt||'').localeCompare(String(a.reservedAt||'')) || (b.idx-a.idx));
  for (const [cid,c] of Object.entries(S.cats)){
    const s = {total:c.total||0, Reserved:0, Assigned:0, Cancelled:0, maxIdx:-1, byType:{}};
    stats[cid]=s;
  }
  for (const e of records){
    const s = stats[e.catId]; if (!s) continue;
    s[e.status] = (s[e.status]||0)+1; if (e.idx>s.maxIdx) s.maxIdx=e.idx;
    const bt = s.byType[e.docType] ||= {Reserved:0,Assigned:0,Cancelled:0}; bt[e.status]=(bt[e.status]||0)+1;
  }
  for (const [cid,s] of Object.entries(stats)){
    const next = Math.max(S.alloc[cid]?.next||0, s.maxIdx+1);
    s.next=next; s.remaining=Math.max(0, s.total-next); s.issued=next;
    const c=S.cats[cid]; s.threshold = Number.isFinite(c.lowThreshold) ? c.lowThreshold : Math.max(10, Math.round(s.total*0.1));
    s.level = s.remaining===0 ? 'empty' : (s.remaining<=s.threshold ? 'low' : 'ok');
  }
  return (S.d={pools,stats,records,names});
}
const catName = id => S.cats[id]?.name || 'Unknown category';
const activeCats = () => Object.entries(S.cats).filter(([,c])=>!c.archived).sort((a,b)=>a[1].name.localeCompare(b[1].name, undefined, {numeric:true}));

/* ---------- Database writes ----------
   Every hand-out runs inside a Firestore transaction: the category's pointer and the
   ledger are read and written atomically, and Firestore retries automatically if two
   people collide, so the same Doc ID can never be given to two requests. The security
   rules also refuse any write that would move the pointer backwards. */
const recKey = idx => 'i'+idx;
const recRefFor = (catId, c) => S.db.doc('rec/'+catId+'__r'+c);
function poolArr(p){ const r=p.regs||[], m=p.meps||[], out=new Array(r.length); for (let i=0;i<r.length;i++) out[i]=[r[i], m[i]||'']; return out; }
async function freshPool(cat){
  const arr=[];
  for (const ch of cat.chunks||[]){
    let p = S.pools[ch.id];
    if (!p){ const snap = await S.db.doc('pool/'+ch.id).get(); if (!snap.exists) throw new AppError('Part of this category’s Doc ID list could not be loaded. Reload the page and try again.'); p = snap.data(); }
    for (const e of poolArr(p)) arr.push(e);
  }
  return arr;
}

/* Hand out the next free Doc IDs. lines: [{docType, qty}] */
async function allocate({catId, lines, mnemonic, format}){
  const count = lines.reduce((a,l)=>a+l.qty,0);
  const reqId = rid('q');
  const catRef = S.db.doc('categories/'+catId), allocRef = S.db.doc('alloc/'+catId);
  const c0 = await catRef.get(); if (!c0.exists) throw new AppError('This category no longer exists.');
  let pool = await freshPool(c0.data());
  return S.db.runTransaction(async tx=>{
    const cs = await tx.get(catRef);
    if (!cs.exists) throw new AppError('This category no longer exists.');
    const cat = cs.data();
    if (cat.archived) throw new AppError('This category has been retired by an administrator.');
    if ((cat.total||0) !== pool.length) pool = await freshPool(cat);
    const as = await tx.get(allocRef);
    let next = as.exists ? (as.data().next||0) : 0;
    // Safety net: never trust the pointer alone — skip past anything already in the ledger.
    const seen = {};
    for (let guard=0; guard<50; guard++){
      let bumped=false;
      const first=Math.floor(next/REC_CHUNK), last=Math.max(first, Math.floor((Math.min(next+count, pool.length)-1)/REC_CHUNK));
      for (let c=first; c<=last; c++){
        if (!seen[c]) seen[c] = await tx.get(recRefFor(catId,c));
        const ents = seen[c].exists ? (seen[c].data().entries||{}) : {};
        for (const e of Object.values(ents)) if (e.idx>=next){ next=e.idx+1; bumped=true; }
      }
      if (!bumped) break;
    }
    const remaining = pool.length - next;
    if (remaining < count) throw new AppError(remaining===0
      ? `There are no Doc IDs left in ${cat.name}. An administrator needs to add a new range.`
      : `Only ${plural(remaining,'Doc ID')} left in ${cat.name}, but you asked for ${count}. Lower the number or ask an administrator for a new range.`, {remaining});
    const at = nowIso(); const items=[]; let i=next;
    for (const l of lines) for (let k=0;k<l.qty;k++,i++){
      const [regular, meps] = pool[i];
      items.push({idx:i, catId, regular:String(regular), meps:meps?String(meps):'', format, mnemonic, docType:l.docType,
        status:'Reserved', reqId, reservedAt:at, reservedBy:S.uid, reservedByName:myName(),
        history:[{at, by:S.uid, byName:myName(), action:'Handed out', note:`${l.docType} for project ${mnemonic}`}]});
    }
    const byChunk={};
    for (const it of items) (byChunk[Math.floor(it.idx/REC_CHUNK)] ||= {})[recKey(it.idx)] = it;
    for (const [c, entries] of Object.entries(byChunk)) tx.set(recRefFor(catId,c), {catId, chunk:Number(c), entries}, {merge:true});
    tx.set(allocRef, {next:i, updatedAt:at, updatedBy:S.uid});
    return {cat, catId, items, reqId};
  });
}

/* Update a set of records atomically. mutate(entry) returns the new entry or null to skip. */
async function mutateRecords(refs, mutate){
  const byCat={};
  for (const r of refs) (byCat[r.catId] ||= []).push(r.idx);
  for (const [catId, idxs] of Object.entries(byCat)){
    await S.db.runTransaction(async tx=>{
      const byChunk={};
      for (const idx of idxs) (byChunk[Math.floor(idx/REC_CHUNK)] ||= []).push(idx);
      const snaps={};
      for (const c of Object.keys(byChunk)) snaps[c] = await tx.get(recRefFor(catId,c));
      for (const [c, list] of Object.entries(byChunk)){
        if (!snaps[c].exists) continue;
        const ents = snaps[c].data().entries||{}; const patch={};
        for (const idx of list){ const e = ents[recKey(idx)]; if (!e) continue; const ne = mutate(JSON.parse(JSON.stringify(e))); if (ne) patch[recKey(idx)] = ne; }
        if (Object.keys(patch).length) tx.set(recRefFor(catId,c), {entries:patch}, {merge:true});
      }
    });
  }
}
function setStatus(refs, status, action, note){
  const at=nowIso();
  return mutateRecords(refs, e=>{
    if (e.status===status) return null;
    e.status=status;
    if (status==='Assigned'){ e.confirmedAt=at; e.confirmedBy=S.uid; e.confirmedByName=myName(); }
    if (status==='Cancelled'){ e.cancelledAt=at; e.cancelledBy=S.uid; e.cancelledByName=myName(); }
    e.history=[...(e.history||[]), {at, by:S.uid, byName:myName(), action, note:note||''}];
    return e;
  });
}

/* ---------- Spreadsheet import ---------- */
function looksLikeId(s){ return /^[A-Za-z0-9][A-Za-z0-9\-_.\/]{0,39}$/.test(s) && /\d/.test(s); }
function parseWorkbook(wb, fileName){
  const sheets = wb.SheetNames.map(n=>({n, ws:wb.Sheets[n]})).filter(s=>s.ws && s.ws['!ref']);
  if (!sheets.length) throw new AppError('This file has no data in it.');
  const {n:sheetName, ws} = sheets[0];
  const R = XLSX.utils.decode_range(ws['!ref']);
  const text = (r,c) => {
    const cell = ws[XLSX.utils.encode_cell({r,c})];
    if (!cell || cell.v==null) return '';
    let s;
    if (cell.t==='n'){ s = cell.w!=null ? String(cell.w) : String(cell.v); if (/e\+/i.test(s) && Number.isInteger(cell.v)) s = String(cell.v); }
    else if (cell.t==='s') s = String(cell.v);
    else s = cell.w!=null ? String(cell.w) : String(cell.v);
    return s.replace(/^[ \t\r\n]+|[ \t\r\n]+$/g,'');
  };
  const r0 = R.s.r; let name=''; const notes=[];
  for (let c=R.s.c;c<=R.e.c;c++){ const t=text(r0,c); if (!t) continue; if (!name) name=t; else notes.push(t); }
  let hdr=-1, regCol=-1, mepsCol=-1;
  for (let r=r0+1; r<=Math.min(R.e.r, r0+6) && hdr<0; r++){
    for (let c=R.s.c;c<=R.e.c;c++){ const t=text(r,c).toLowerCase(); if (/regular/.test(t)){regCol=c;hdr=r;} else if (/meps/.test(t)){mepsCol=c;hdr=r;} }
  }
  if (hdr<0){ // no header row: find columns by content
    hdr=r0;
    for (let c=R.s.c;c<=R.e.c && (regCol<0||mepsCol<0);c++){
      for (let r=r0+1;r<=Math.min(R.e.r,r0+20);r++){ const t=text(r,c); if (!t) continue;
        if (mepsCol<0 && /[\uE000-\uF8FF]/.test(t)) { mepsCol=c; break; }
        if (regCol<0 && looksLikeId(t)) { regCol=c; break; } }
    }
  }
  if (regCol<0 && mepsCol<0) throw new AppError('Couldn’t find a column of Doc IDs. Put the category name in A1 and the Doc IDs in a column below it.');
  const headerRegular = regCol>=0 && hdr>r0 ? text(hdr,regCol) : 'Regular Numbers';
  const headerMeps = mepsCol>=0 && hdr>r0 ? text(hdr,mepsCol) : 'MEPS Numbers';
  const rows=[]; const seen=new Set();
  for (let r=hdr+1;r<=R.e.r;r++){
    const reg = regCol>=0 ? text(r,regCol) : ''; const meps = mepsCol>=0 ? text(r,mepsCol) : '';
    const others=[]; for (let c=R.s.c;c<=R.e.c;c++){ if (c===regCol||c===mepsCol) continue; const t=text(r,c); if (t) others.push(t); }
    if (!reg && !meps){ notes.push(...others); continue; }
    if (!meps && !looksLikeId(reg)){ notes.push([reg,...others].join(' ')); continue; }
    notes.push(...others);
    const row = {reg: reg || mepsDigits(meps), meps, line:r+1, flags:[]};
    if (!reg) row.flags.push('noreg');
    if (mepsCol>=0 && !meps) row.flags.push('nomeps');
    if (reg && meps && mepsDigits(meps)!==reg) row.flags.push('mismatch');
    if (seen.has(row.reg)) row.dup=true; seen.add(row.reg);
    rows.push(row);
  }
  if (!rows.length) throw new AppError('No Doc IDs were found under the header row.');
  return {name: name || fileName.replace(/\.[^.]+$/,''), notes:[...new Set(notes)], rows, hasMeps: mepsCol>=0,
          headerRegular, headerMeps, sheetName, extraSheets: sheets.length-1};
}
function checkOverlap(parsed){
  const {pools} = derive(); const owner = new Map();
  for (const [cid,p] of Object.entries(pools)) for (const [reg] of p.arr) owner.set(String(reg), cid);
  const hits={};
  for (const row of parsed.rows){ row.overlap = owner.get(row.reg) || null; if (row.overlap) hits[row.overlap]=(hits[row.overlap]||0)+1; }
  parsed.overlapByCat = hits;
}
async function readFiles(files){
  if (!window.XLSX){ toast('The spreadsheet reader didn’t load. Check your connection and reload the page.'); return; }
  for (const f of files){
    const imp = {key:rid('f'), fileName:f.name, status:'ready', msg:'', target:'new'};
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellText:true, cellNF:true});
      imp.parsed = parseWorkbook(wb, f.name); checkOverlap(imp.parsed); imp.name = imp.parsed.name;
      const same = Object.entries(S.cats).find(([,c])=>c.name.trim().toLowerCase()===imp.name.trim().toLowerCase());
      if (same) imp.sameNameAs = same[0];
    } catch(e){ imp.status='error'; imp.msg = e instanceof AppError ? e.message : 'This file couldn’t be read as a spreadsheet.'; }
    S.imports.unshift(imp);
  }
  schedule();
}
async function runImport(imp){
  const p = imp.parsed; const ids = p.rows.filter(r=>!r.dup && !r.overlap).map(r=>[r.reg, r.meps||'']);
  if (!ids.length) throw new AppError('Every one of these Doc IDs is already in the system, so there is nothing to add.');
  const at = nowIso();
  const source = {name:imp.fileName, importedAt:at, importedBy:S.uid, importedByName:myName(), count:ids.length, first:ids[0][0], last:ids[ids.length-1][0]};
  const makeChunks = catId => { const chunks=[], docs=[];
    for (let i=0;i<ids.length;i+=POOL_CHUNK){ const id=catId+'__p'+rid(); const part=ids.slice(i,i+POOL_CHUNK);
      docs.push([id, {catId, regs:part.map(x=>x[0]), meps:part.map(x=>x[1])}]); chunks.push({id, count:part.length}); }
    return {chunks, docs}; };
  if (imp.target==='new'){
    const name = (imp.name||'').trim(); if (!name) throw new AppError('Give the category a name.');
    const catId = 'c-'+slug(name)+'-'+Math.random().toString(36).slice(2,6);
    const {chunks, docs} = makeChunks(catId);
    const batch = S.db.batch();
    for (const [id,d] of docs) batch.set(S.db.doc('pool/'+id), d);
    batch.set(S.db.doc('categories/'+catId), {name, sourceFiles:[source], notes:p.notes, hasMeps:p.hasMeps, headerRegular:p.headerRegular,
      headerMeps:p.headerMeps, total:ids.length, chunks, createdAt:at, createdBy:S.uid, lowThreshold:null, archived:false});
    await batch.commit();
    return catId;
  } else {
    const catId = imp.target; const catRef = S.db.doc('categories/'+catId);
    await S.db.runTransaction(async tx=>{
      const snap = await tx.get(catRef); if (!snap.exists) throw new AppError('That category no longer exists.');
      const c = snap.data(); const {chunks, docs} = makeChunks(catId);
      for (const [id,d] of docs) tx.set(S.db.doc('pool/'+id), d);
      tx.update(catRef, {total:(c.total||0)+ids.length, chunks:[...(c.chunks||[]), ...chunks], sourceFiles:[...(c.sourceFiles||[]), source],
        notes:[...new Set([...(c.notes||[]), ...p.notes])], hasMeps: !!(c.hasMeps||p.hasMeps)});
    });
    return catId;
  }
}

/* ---------- Range builder ---------- */
function parseRangeList(text, width){
  const out=[]; if (!text.trim()) return {list:out};
  for (const tok of text.split(/[,;\n]+/).map(t=>t.trim()).filter(Boolean)){
    const m = tok.match(/^(\d+)\s*(?:-|–|to)\s*(\d+)$/i) || tok.match(/^(\d+)$/);
    if (!m) return {error:`“${tok}” isn’t a number or a range like 902026900-902026999.`};
    const a=BigInt(m[1]), b=BigInt(m[2]||m[1]);
    out.push(a<=b?[a,b]:[b,a]);
  }
  return {list:out};
}
function buildRange(R){
  const first=R.first.trim(), last=R.last.trim();
  if (!first || !last) return {empty:true};
  if (!/^\d+$/.test(first) || !/^\d+$/.test(last)) return {error:'Doc IDs in a range must be whole numbers, digits only.'};
  if (first.length!==last.length) return {error:`The first and last Doc IDs need the same number of digits (${first.length} and ${last.length}).`};
  const a=BigInt(first), b=BigInt(last);
  if (b<a) return {error:'The last Doc ID must be the same as or higher than the first.'};
  const ex = parseRangeList(R.exclude, first.length); if (ex.error) return {error:ex.error};
  const span = b-a+1n;
  if (span > BigInt(MAX_RANGE*3)) return {error:`That range covers ${span.toLocaleString()} numbers. Add ranges of up to ${MAX_RANGE.toLocaleString()} Doc IDs at a time.`};
  const rows=[]; let skipped=0;
  for (let n=a; n<=b; n++){
    const reg = n.toString().padStart(first.length,'0');
    const tail = Number(reg.slice(-3));
    if ((R.skipTop && tail>=900) || ex.list.some(([x,y])=>n>=x && n<=y)){ skipped++; continue; }
    rows.push({reg, meps:R.meps?toMeps(reg):'', flags:[]});
  }
  if (!rows.length) return {error:'Every number in this range is left out, so there is nothing to add.'};
  if (rows.length > MAX_RANGE) return {error:`That range has ${rows.length.toLocaleString()} Doc IDs. Add up to ${MAX_RANGE.toLocaleString()} at a time.`};
  const notes = R.notes.split('\n').map(t=>t.trim()).filter(Boolean);
  const parsed = {name:R.name.trim(), notes, rows, hasMeps:R.meps, headerRegular:'Regular Numbers', headerMeps:'MEPS Numbers', sheetName:'', extraSheets:0};
  checkOverlap(parsed);
  return {parsed, skipped, first, last};
}

/* ---------- Clipboard ---------- */
async function copyIds(raws, isMeps){
  const plain = raws.join('\n');
  const html = raws.map(r => isMeps ? `<span style="font-family:'MEPS Bookman Universal'">${esc(r)}</span>` : esc(r)).join('<br>');
  try { if (isMeps && navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([plain],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})]); return true; } } catch(e){}
  try { if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(plain); return true; } } catch(e){}
  try {
    const box = el('div',{style:`position:fixed;left:-9999px;top:0;white-space:pre;${isMeps?"font-family:'MEPS Bookman Universal'":''}`});
    box.textContent = plain; document.body.append(box);
    const rg=document.createRange(); rg.selectNodeContents(box); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    const ok = document.execCommand('copy'); sel.removeAllRanges(); box.remove(); if (ok) return true;
  } catch(e){}
  return false;
}

function screen(title, body){ return el('div',{class:'card signin stack'}, el('h1',null,title), body); }
const USERNAME_RE = /^[a-z0-9](?:[a-z0-9._-]{0,28}[a-z0-9])?$/;

async function submitRequest(){
  const f=S.form; S.formErr='';
  const mnemonic=f.mnemonic.trim();
  const lines=f.lines.map(l=>({docType:l.type, qty:parseInt(l.qty,10)}));
  if (!mnemonic){ S.formErr='Enter the project mnemonic.'; render(); document.getElementById('f-mn')?.focus(); return; }
  if (lines.some(l=>!l.docType)){ S.formErr='Choose a document type for each line.'; render(); return; }
  if (lines.some(l=>!Number.isInteger(l.qty) || l.qty<1)){ S.formErr='Each line needs a number of Doc IDs of 1 or more.'; render(); return; }
  const count=lines.reduce((a,l)=>a+l.qty,0);
  if (count>MAX_PER_REQUEST){ S.formErr=`You can get up to ${MAX_PER_REQUEST} Doc IDs in one request.`; render(); return; }
  const s=derive().stats[f.catId];
  if (count>s.remaining){ S.formErr=`Only ${plural(s.remaining,'Doc ID')} left in this category.`; render(); return; }
  S.busy=true; S.busyMsg=''; render();
  try {
    const res = await allocate({catId:f.catId, lines, mnemonic, format:f.format});
    S.busy=false; S.busyMsg=''; f.lines=[{type:lines[0].docType, qty:1}]; render();
    openAssignedModal(res);
  } catch(e){
    S.busy=false; S.busyMsg='';
    S.formErr = e instanceof AppError ? e.message : (e && e.code==='quota_exceeded' ? 'The Doc ID database is full. Ask an administrator for help.' : 'The Doc IDs couldn’t be assigned. Nothing was handed out. Try again.');
    render();
  }
}

/* ----- Records view ----- */
function filteredRecords(){
  const F=S.filters; const q=mepsDigits(F.q).trim().toLowerCase();
  const from = F.from ? new Date(F.from+'T00:00:00').toISOString() : '';
  const to = F.to ? new Date(F.to+'T23:59:59.999').toISOString() : '';
  return derive().records.filter(r=>{
    if (F.catId && r.catId!==F.catId) return false;
    if (F.docType && r.docType!==F.docType) return false;
    if (F.status && r.status!==F.status) return false;
    if (from && r.reservedAt<from) return false;
    if (to && r.reservedAt>to) return false;
    if (q){ const hay=(r.regular+' '+mepsDigits(r.meps)+' '+r.mnemonic+' '+r.docType+' '+catName(r.catId)).toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
}
function lookupUnassigned(q){

    const i = p.arr.findIndex(([reg])=>String(reg)===q);

  }
  return {none:true};
}

async function exportRecords(list, kind){

  const rows=list.map(r=>{ const last=(r.history||[]).slice(-1)[0]||{};
    return [r.regular, r.meps||'', r.meps?mepsDigits(r.meps):'', r.format==='meps'?'MEPS':'Regular', r.mnemonic, catName(r.catId), r.docType, r.status,

      last.action ? `${last.action}${last.note?': '+last.note:''}` : '']; });

    return save(`doc-id-records-${stamp}.csv`, csv);

  const ws=XLSX.utils.aoa_to_sheet([header,...rows]); ws['!cols']=header.map((h,i)=>({wch:[14,16,14,9,16,26,18,11,20,18,20,18,20,18,40][i]}));

async function save(filename, data){
  const type = filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const url = URL.createObjectURL(new Blob([data], {type}));
  const a = el('a',{href:url, download:filename, style:'display:none'}); document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
}

function openEditModal(r){
  const root=document.getElementById('modal-root');
  const types=[...new Set([...docTypes(true).map(t=>t.name), r.docType])];
  const mn=el('input',{id:'e-mn',type:'text',value:r.mnemonic}); const ty=el('select',{id:'e-ty',value:r.docType}, types.map(t=>opt(t,t,t===r.docType)));
  const stS=el('select',{id:'e-st',value:r.status}, STATUSES.map(s=>opt(s,`${s} — ${STATUS_HELP[s]}`,s===r.status)));
  const why=el('textarea',{id:'e-why', placeholder:'e.g. Wrong mnemonic typed; should be JWB-SPR'}); const err=el('p',{class:'err-text',role:'alert'});
  const saveB=el('button',{class:'btn primary',onclick:doSave},'Save correction');
  const dlg=el('div',{class:'dialog',role:'dialog','aria-modal':'true','aria-labelledby':'e-t'},
    el('header',null, el('h2',{id:'e-t'}, `Correct Doc ID ${r.regular}`), el('p',{class:'hint',style:'margin:0'}, `${catName(r.catId)}. Every change is kept in the record’s history. A cancelled Doc ID is never given out again.`)),
    el('div',{class:'body'},
      el('div',{class:'field'}, el('label',{for:'e-mn'},'Project mnemonic'), mn),
      el('div',{class:'field'}, el('label',{for:'e-ty'},'Document type'), ty),
      el('div',{class:'field'}, el('label',{for:'e-st'},'Status'), stS),
      el('div',{class:'field'}, el('label',{for:'e-why'},'Reason for the change'), why), err),
    el('footer',null, el('button',{class:'btn',onclick:close},'Close without saving'), saveB));
  root.replaceChildren(el('div',{class:'overlay', onclick:e=>{ if(e.target===e.currentTarget) close(); }}, dlg));
  document.body.style.overflow='hidden'; setTimeout(()=>mn.focus(),30);
  function close(){ root.replaceChildren(); document.body.style.overflow=''; }
  async function doSave(){
    const nm=mn.value.trim(), nt=ty.value, ns=stS.value, reason=why.value.trim();
    if (!nm){ err.textContent='The project mnemonic can’t be empty.'; return; }
    if (!reason){ err.textContent='Add a reason so the audit trail shows why this changed.'; why.focus(); return; }
    const changes=[]; if (nm!==r.mnemonic) changes.push(`project ${r.mnemonic} → ${nm}`); if (nt!==r.docType) changes.push(`type ${r.docType} → ${nt}`); if (ns!==r.status) changes.push(`status ${r.status} → ${ns}`);
    if (!changes.length){ err.textContent='Nothing has changed.'; return; }
    saveB.disabled=true; const at=nowIso();
    try {
      await mutateRecords([{catId:r.catId, idx:r.idx}], e=>{
        e.mnemonic=nm; e.docType=nt;
        if (ns!==e.status){ e.status=ns; if (ns==='Assigned'){e.confirmedAt=at;e.confirmedBy=S.uid;e.confirmedByName=myName();} if (ns==='Cancelled'){e.cancelledAt=at;e.cancelledBy=S.uid;e.cancelledByName=myName();} }
        e.history=[...(e.history||[]), {at, by:S.uid, byName:myName(), action:'Corrected by administrator', note:`${changes.join('; ')}. Reason: ${reason}`}];
        return e; });
      close(); toast('Correction saved.');
    } catch(e){ err.textContent='The correction couldn’t be saved. Try again.'; saveB.disabled=false; }
  }
}

function suggestPassword(){
  const chars='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a=new Uint32Array(10); crypto.getRandomValues(a);
  return [...a].map(n=>chars[n%chars.length]).join('');

function usernameFrom(name){
  return name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'').replace(/\.{2,}/g,'.').slice(0,30).replace(/[._-]+$/,'');
}

function internalEmail(username){
  const host = String((window.DOCID_FIREBASE_CONFIG||{}).authDomain || 'docid.app').toLowerCase();
  return `${username}.${Math.random().toString(36).slice(2,8)}@users.${host}`;

/* Create a password login for someone else without signing the administrator out:
   a second, separate Firebase connection is used just for this. */
async function createLogin(email, pw, name){
  const app2 = firebase.apps.find(a=>a.name==='people') || firebase.initializeApp(window.DOCID_FIREBASE_CONFIG, 'people');
  const a2 = app2.auth(); try { await a2.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch(e){}
  try {
    const c = await a2.createUserWithEmailAndPassword(email, pw);
    if (name){ try { await c.user.updateProfile({displayName:name}); } catch(e){} }
    const uid = c.user.uid; await a2.signOut(); return uid;
  } catch(x){
    const code = x && x.code;
    if (code==='auth/weak-password' || code==='auth/password-does-not-meet-requirements') throw new AppError('That password is too weak. Use at least 8 characters, or click “Suggest one”.');
    if (code==='auth/operation-not-allowed') throw new AppError('Password sign-in is turned off. In Firebase, go to Authentication → Sign-in method and enable Email/Password.');
    if (code==='auth/email-already-in-use') throw new AppError('That login already exists. Try again.');
    throw new AppError('The login couldn’t be created. Try again.');
  }
}

function subscribe(){
  const map={categories:'cats', pool:'pools', alloc:'alloc', rec:'rec', config:'config'};
  for (const [coll,key] of Object.entries(map)){
    S.unsubs.push(S.db.collection(coll).onSnapshot(snap=>{
      const m={}; for (const d of snap.docs) if (d.exists) m[d.id]=d.data();
      S[key]=m; S.loaded[key]=true; invalidate();
      if (!S.ready && Object.values(S.loaded).every(Boolean)) S.ready=true;
      schedule();
    }, err=>{
      S.loaded[key]=true; if (Object.values(S.loaded).every(Boolean)) S.ready=true;
      if (err && err.code==='permission-denied'){ S.phase='noaccess'; S.noAccessMsg='Your access was removed or changed. Ask an administrator, then reload.'; }
      else toast('Live updates paused. Reload the page if numbers look out of date.', 6000);
      schedule();
    }));
  }
  if (S.isAdmin) S.unsubs.push(S.db.collection('members').onSnapshot(snap=>{ const m={}; for (const d of snap.docs) m[d.id]=d.data(); S.members=m; invalidate(); schedule(); }, ()=>{}));
}
function resetData(){
  S.unsubs.forEach(u=>{ try{u();}catch(e){} }); S.unsubs=[];
  Object.assign(S, {cats:{}, pools:{}, alloc:{}, rec:{}, config:{}, members:{}, ready:false, isAdmin:false, d:null});
  for (const k of Object.keys(S.loaded)) S.loaded[k]=false;
}
async function enterApp(){
  const u = S.auth.currentUser;
  const m = await S.db.doc('members/'+S.me.email).get();
  if (!m.exists){
    if (!u.emailVerified){ S.phase='noaccess'; render(); return; }
    const setup = await S.db.doc('config/setup').get(); S.phase = setup.exists ? 'noaccess' : 'setup'; render(); return;
  }
  const md = m.data();
  if (!u.emailVerified && md.uid !== u.uid){
    S.phase='noaccess'; S.noAccessMsg='This login no longer works, for example because your password was reset. Sign in again with your newest password, or ask an administrator for help.'; render(); return;
  }
  S.isAdmin = md.role==='admin'; if (md.name) S.me.name = md.name;
  S.canWrite = true; S.phase='app'; S.view='request'; subscribe(); render();
}
async function boot(){

  if (S.auth.isSignInWithEmailLink(location.href)){
    let em=null; try{ em=localStorage.getItem('docid-email'); }catch(e){}
    if (!em) em = prompt('To finish signing in, confirm your email address.');
    if (em){ try { await S.auth.signInWithEmailLink(em.trim().toLowerCase(), location.href); try{ localStorage.removeItem('docid-email'); }catch(e){} }
      catch(e){ S.authErr='That sign-in link has expired or was already used. Request a new one.'; } }
    history.replaceState(null, '', location.pathname);
  }
  S.auth.onAuthStateChanged(async u=>{
    resetData();
    if (!u){ S.phase='signin'; S.uid=null; S.me={email:'',name:''}; render(); return; }
    const email=(u.email||'').toLowerCase(); S.uid=email; S.me={email, name:u.displayName||''}; S.authMsg='';
    if (!email){ S.phase='noaccess'; S.noAccessMsg='This login has no email address. Sign in with your email and password, Google, or an emailed link.'; render(); return; }
    S.phase='loading'; render();
    try { await enterApp(); }
    catch(e){ S.phase='error'; S.errMsg = e && e.code==='permission-denied' ? 'The database refused access. Check that the security rules from firestore.rules are published.' : 'Check your connection and reload the page.'; render(); }
  });
}
boot();
</script>
</body>
</html>
